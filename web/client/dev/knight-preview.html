<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dog Knight — Model Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#292b30;color:#eee1c6;font:14px system-ui}canvas{display:block}header{position:fixed;top:28px;left:32px;pointer-events:none}h1{font:38px Georgia;margin:0;color:#e6c890}p{color:#d4c9b8;line-height:1.6}footer{position:fixed;bottom:24px;left:32px;display:flex;gap:8px}button{border:1px solid #8b795a;background:#33363bec;color:#f5e8cb;border-radius:6px;padding:10px 16px;cursor:pointer}#status{position:fixed;right:24px;bottom:25px;color:#d6c5a3}
</style></head><body>
<header><h1>Dog Knight</h1><p>อัศวินผู้ซื่อสัตย์<br>โมเดล 3D · Silver / Antique Gold / Royal Blue<br>ลากเพื่อหมุน · เลื่อนเพื่อซูม</p></header>
<footer><button id="front">ด้านหน้า</button><button id="back">ด้านหลัง</button><button id="spin">หมุนอัตโนมัติ</button><button id="armor">ถอด / ใส่ชุด</button></footer><div id="status">กำลังโหลดโมเดล…</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x292b30);
const pmrem=new THREE.PMREMGenerator(renderer),room=new RoomEnvironment();const env=pmrem.fromScene(room,.04);scene.environment=env.texture;room.dispose();pmrem.dispose();
scene.add(new THREE.HemisphereLight(0xe2e9ff,0x584c43,1.6));
const key=new THREE.DirectionalLight(0xffe2bd,3);key.position.set(-2,4,3);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-1.5;key.shadow.camera.right=1.5;key.shadow.camera.top=2;key.shadow.camera.bottom=-1;key.shadow.normalBias=.008;scene.add(key);
const rim=new THREE.DirectionalLight(0xa5c8ff,2);rim.position.set(2,2,-2);scene.add(rim);
const pedestal=new THREE.Mesh(new THREE.CylinderGeometry(.65,.69,.055,64),new THREE.MeshStandardMaterial({color:0x555052,roughness:.85}));pedestal.position.y=-.034;pedestal.receiveShadow=true;scene.add(pedestal);
const camera=new THREE.PerspectiveCamera(33,innerWidth/innerHeight,.01,30);camera.position.set(1.1,.85,2.2);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.48,0);controls.minDistance=.85;controls.maxDistance=4;controls.maxPolarAngle=Math.PI*.52;controls.enableDamping=true;controls.update();
let character,wearing=true;
const loader=new GLTFLoader();
loader.register(parser=>{parser.textureLoader=new THREE.TextureLoader(parser.options.manager);return{name:'BK_ImgTextures'};});
loader.load('/assets/knight-refined.glb',g=>{
 character=g.scene;character.traverse(n=>{if(n.isMesh){n.castShadow=n.receiveShadow=true;const mats=Array.isArray(n.material)?n.material:[n.material];for(const m of mats){m.envMapIntensity=.75;for(const t of Object.values(m))if(t instanceof THREE.Texture)t.anisotropy=renderer.capabilities.getMaxAnisotropy();}}});
 scene.add(character);document.getElementById('status').textContent='ชุดเต็ม · โครงกระดูก SK_BK_Chibi';
},undefined,e=>{document.getElementById('status').textContent='โหลดโมเดลไม่สำเร็จ';console.error(e)});
document.getElementById('front').onclick=()=>{camera.position.set(0,.72,2.25);controls.target.set(0,.48,0);controls.update()};
document.getElementById('back').onclick=()=>{camera.position.set(0,.72,-2.25);controls.target.set(0,.48,0);controls.update()};
document.getElementById('spin').onclick=()=>{controls.autoRotate=!controls.autoRotate};
document.getElementById('armor').onclick=()=>{wearing=!wearing;character?.traverse(n=>{if(n.isMesh&&/Knight_|KnightSword|KiteShield/.test(n.name))n.visible=wearing})};
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
</script></body></html>
